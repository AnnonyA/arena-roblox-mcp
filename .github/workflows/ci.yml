name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Resolve modules
        run: |
          go mod tidy
          echo GO_SUM_BEGIN
          cat go.sum
          echo GO_SUM_END
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race
        run: go test -race ./...
