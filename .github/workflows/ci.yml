name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Format
        shell: bash
        run: |
          unformatted="$(git diff --name-only --diff-filter=ACMRT HEAD^ HEAD -- '*.go' | xargs -r gofmt -l)"
          if [ -n "$unformatted" ]; then
            printf 'The following changed Go files are not gofmt-formatted:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race
        run: go test -race ./...
      - name: Benchmarks
        run: go test ./... -run '^$' -bench 'Benchmark(CLIStartup|ToolRegistry|ContextProcessing|StreamParser)$' -benchtime=1x

  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Build Windows CLI
        run: go build -o arena-rbx.exe ./cmd/arena-rbx
